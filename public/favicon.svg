<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    WoW Citadel mark, drawn for 16px tabs: one solid raised-surface square and
    one 3px gold diamond (the Logo's rotated square). No gradients, no thin or
    low-opacity rings.
  -->
  <style>
    .frame { fill: #0b1220; }
    @media (prefers-color-scheme: light) {
      .frame { fill: #040813; }
    }
  </style>
  <rect class="frame" width="32" height="32" rx="8" />
  <rect x="9" y="9" width="14" height="14" rx="2" fill="none" stroke="#f5c045" stroke-width="3" stroke-linejoin="round" transform="rotate(45 16 16)" />
</svg>

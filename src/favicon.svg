<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- 135° gradient: gold top-left → blue bottom-right, matching the Logo component -->
    <linearGradient id="logoGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5c045" stop-opacity="0.95" />
      <stop offset="1" stop-color="#1e9be9" stop-opacity="0.92" />
    </linearGradient>
  </defs>

  <!-- Outer rounded square — gradient fill, rx=11 (≈14 * 0.8) -->
  <rect width="32" height="32" rx="11" fill="url(#logoGrad)" />

  <!-- Inner dark panel — inset 1.6 px (≈2 * 0.8), rx=9.6 -->
  <rect x="1.6" y="1.6" width="28.8" height="28.8" rx="9.6" fill="#050813" fill-opacity=".86" stroke="#ffffff" stroke-opacity=".12" stroke-width=".8" />

  <!-- Diamond — rotated rounded square, inset 8.8 px (≈11 * 0.8) -->
  <rect x="8.8" y="8.8" width="14.4" height="14.4" rx="6.4" fill="none" stroke="#ffffff" stroke-opacity=".78" stroke-width="1.6" transform="rotate(45 16 16)" />
</svg>